name: Build

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy -p fuji-core --all-targets -- -D warnings
      - run: cargo test -p fuji-core

  smart-search-model:
    name: Smart search (real model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v5
        with:
          path: .models
          key: siglip-base-patch16-224-cpu
      # Downloads the same model the app does and checks real image↔text
      # matching end to end (inputs, outputs, preprocessing, tokenizer).
      - run: cargo test -p fuji-core -- --ignored --nocapture real_siglip
        env:
          FUJICLOUD_MODEL_DIR: ${{ github.workspace }}/.models
      - uses: actions/cache@v5
        with:
          path: |
            .models/faces
            .models/face-test
          key: faces-buffalo-l-lfw-v1
      # Face detection and recognition with the real models on real photos:
      # the same person must match across photos, different people mustn't,
      # and twelve people from LFW must be grouped apart.
      - name: Face recognition (real models)
        run: cargo test -p fuji-core -- --ignored --nocapture real_faces
        env:
          FUJICLOUD_MODEL_DIR: ${{ github.workspace }}/.models
          FUJICLOUD_FACE_TEST: ${{ github.workspace }}/.models/face-test
      # Pets: the detector finds cats and dogs, and the smart search model
      # tells cats of different types apart.
      - name: Pets (real models)
        run: cargo test -p fuji-core -- --ignored --nocapture real_cats real_pets
        env:
          FUJICLOUD_MODEL_DIR: ${{ github.workspace }}/.models
          FUJICLOUD_PET_TEST: ${{ github.workspace }}/.models/pet-test

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # GPU smart search: ship Microsoft's DirectML runtime next to the app.
      - name: Fetch DirectML
        run: pwsh scripts/fetch-directml.ps1 -Into target/debug/deps
      # The installer's version ends in the build number: Build #29 is 0.2.29,
      # which the app shows next to its name.
      - name: Stamp the build number into the version
        shell: bash
        run: >-
          node -e "const fs = require('fs'); const f = 'src-tauri/tauri.conf.json';
          const c = JSON.parse(fs.readFileSync(f, 'utf8'));
          c.version = c.version.replace(/[0-9]+$/, process.env.GITHUB_RUN_NUMBER);
          fs.writeFileSync(f, JSON.stringify(c, null, 2) + '\\n'); console.log('version', c.version)"
      - name: Build installer
        run: npx tauri build --config src-tauri/tauri.directml.conf.json
      - uses: actions/upload-artifact@v7
        with:
          name: Fujicloud-Windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
      # The installed app, started with a library of awkward files and every
      # analysis on, must still be running minutes later.
      - name: App starts and keeps running
        shell: pwsh
        run: pwsh scripts/smoke-test.ps1 -Seconds 180 -Screens smoke-screens
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-test-screens
          path: smoke-screens
          if-no-files-found: ignore
      # The checks below run after the upload, so a lint added in a new Rust
      # release never blocks getting an installer.
      - name: Core tests on Windows (incl. ONNX Runtime)
        run: cargo test -p fuji-core
      # Movie posters without File Explorer's help: a real H.264 clip is
      # decoded with Media Foundation.
      - name: Movie frames on Windows
        run: cargo test -p fuji-core -- --ignored --nocapture real_movie
      # iPhone HEVC (SDR and HDR) on a PC without Microsoft's HEVC codec:
      # the FFmpeg the app downloads converts it to H.264 Windows can read.
      - uses: actions/cache@v5
        with:
          path: .ffmpeg
          key: ffmpeg-6.1.1-win64
      - name: HEVC movies on Windows (FFmpeg)
        run: cargo test -p fuji-core -- --ignored --nocapture real_ffmpeg
        env:
          FUJICLOUD_MODEL_DIR: ${{ github.workspace }}/.ffmpeg
      - uses: actions/cache@v5
        with:
          path: .models
          key: siglip-base-patch16-224-gpu
      # Real model on the CPU and through DirectML (on Windows' software
      # renderer, since CI machines have no GPU): proves the GPU code path,
      # the fp16 model and the bundled DirectML.dll work together.
      - name: Smart search on Windows (CPU + DirectML)
        run: cargo test -p fuji-core -- --ignored --nocapture real_siglip
        env:
          FUJICLOUD_MODEL_DIR: ${{ github.workspace }}/.models
      - name: Clippy
        run: cargo clippy -p fujicloud --all-targets -- -D warnings
      - name: App tests on Windows
        run: cargo test -p fujicloud --lib
