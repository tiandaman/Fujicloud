[package]
name = "fuji-core"
description = "Library indexing, Fujifilm metadata and thumbnail pipeline for Fujicloud"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["smart-search"]
# On-device image/text embeddings (ONNX Runtime) for "search by what's in the photo".
smart-search = ["dep:ort", "dep:tokenizers", "dep:ureq", "dep:half"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
flate2 = "1"
fast_image_resize = "6"
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = "0.7"
kamadak-exif = "0.6"
log = "0.4"
parking_lot = "0.12"
qcms = "0.3"
rayon = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiff = "0.11"
heic-decoder = "=0.1.1"
png = "0.18"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
half = { version = "2", optional = true }
ort = { version = "=2.0.0-rc.15", optional = true, features = ["half"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"], optional = true }
ureq = { version = "3", optional = true }

# GPU acceleration: DirectML is compiled into the Windows ONNX Runtime build;
# DXGI finds the card it will run on. The Shell makes movie poster frames.
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.15", optional = true, features = ["half", "directml"] }
windows = { version = "0.62", features = [
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
tempfile = "3"

# Tests run DirectML on WARP (Windows' software renderer) when there's no GPU.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = [
  "Win32_AI_MachineLearning_DirectML",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
] }
