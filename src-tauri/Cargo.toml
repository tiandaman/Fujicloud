[package]
name = "fujicloud"
description = "A fast photo library for Fujifilm shooters"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "fujicloud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fuji-core = { path = "../crates/fuji-core" }
log = { version = "0.4", features = ["std"] }
notify = "8"
parking_lot = "0.12"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-drag = "2.1"
tauri-plugin-opener = "2.7"
trash = "5"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8"
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem"] }
