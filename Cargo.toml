[workspace]
resolver = "3"
members = ["crates/fuji-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
# Not "abort": one photo that trips a bug in a decoder must fail on its own
# (see fuji_core::guard), not close the app.
strip = true

# Image decoding is hot even in debug builds; keep dependencies optimised.
[profile.dev.package."*"]
opt-level = 3
